    <line x1='0' y1='520' x2='800' y2='520'/><line x1='0' y1='640' x2='800' y2='640'/>
    <line x1='160' y1='0' x2='160' y2='800'/><line x1='280' y1='0' x2='280' y2='800'/>
    <line x1='520' y1='0' x2='520' y2='800'/><line x1='640' y1='0' x2='640' y2='800'/>
  </g>

