    <circle cx='238' cy='118' r='2.5' fill='#ffc43c' opacity='0.8'/>
    <circle cx='150' cy='210' r='2' fill='#ff5a30' opacity='0.7'/>
    <circle cx='612' cy='132' r='3.5' fill='#ff8420' opacity='0.85'/>
    <circle cx='662' cy='180' r='2' fill='#ffc43c' opacity='0.75'/>
    <circle cx='596' cy='220' r='2.8' fill='#ff5a30' opacity='0.7'/>
    <circle cx='176' cy='600' r='3' fill='#ff8420' opacity='0.8'/>
    <circle cx='224' cy='652' r='2' fill='#ffc43c' opacity='0.7'/>
