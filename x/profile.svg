  <!-- seal rings -->
  <path d='M 652,388 A 252,252 0 1 0 148,388 A 252,252 0 1 0 652,388 Z M 642,388 A 242,242 0 1 1 158,388 A 242,242 0 1 1 642,388 Z' fill='#e8c25a' fill-rule='evenodd'/>
  <path d='M 626,388 A 226,226 0 1 0 174,388 A 226,226 0 1 0 626,388 Z M 623.5,388 A 223.5,223.5 0 1 1 176.5,388 A 223.5,223.5 0 1 1 623.5,388 Z' fill='#8a6d1f' fill-rule='evenodd'/>
  <circle cx='400' cy='388' r='252' fill='none' stroke='#5a120c' stroke-width='1' stroke-dasharray='4 10' opacity='0.8'/>

