<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800'>
  <defs>
    <radialGradient id="bg" cx='50%' cy='42%' r='75%'>
      <stop offset='0%' stop-color='#4d120b'/>
      <stop offset='45%' stop-color='#2e0606'/>
      <stop offset='100%' stop-color='#160202'/>
    </radialGradient>
    <radialGradient id="glow" cx='50%' cy='46%' r='40%'>
      <stop offset='0%' stop-color='#ff5a30' stop-opacity='0.40'/>
      <stop offset='100%' stop-color='#ff5a30' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id="goldg" x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#f5d67a'/>
      <stop offset='50%' stop-color='#d4a017'/>
      <stop offset='100%' stop-color='#a97b12'/>
    </linearGradient>
  </defs>

  <rect width='800' height='800' fill='#1c0404'/>
  <circle cx='400' cy='388' r='380' fill='#ff4a24' fill-opacity='0.10'/>
  <circle cx='400' cy='388' r='270' fill='#ff6a30' fill-opacity='0.07'/>

  <!-- faint passport grid -->
