  <text x='400' y='500' text-anchor='middle' font-family='DejaVu Serif, serif' font-weight='bold' font-size='330' fill='#e8c25a'>C</text>

  <!-- barcode strip under C -->
  <g fill='#d4a017'>
    <rect x='300' y='548' width='7' height='34'/>
    <rect x='312' y='548' width='3' height='34'/>
    <rect x='320' y='548' width='10' height='34'/>
